name: Pull Request Tests

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --settings coverage.runsettings --collect:"XPlat Code Coverage"

      - name: Generate Code Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'tests/**/TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;MarkdownSummary'

      - name: Publish Coverage Summary to GitHub Step Summary
        run: cat coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-ci
          path: |
            tests/**/TestResults/**/coverage.cobertura.xml
            coveragereport/
